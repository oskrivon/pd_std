<!-- Tasks list partial - updated after adding task -->
{% for task in tasks %}
<div class="bg-gray-700 rounded p-3 flex items-start justify-between">
    <div class="flex-1">
        <div class="flex items-center space-x-2">
            <span class="text-xs px-2 py-0.5 rounded bg-gray-600">{{ task.project }}</span>
            {% if task.priority.name == "CRITICAL" %}
            <span class="text-xs px-2 py-0.5 rounded bg-red-600">critical</span>
            {% elif task.priority.name == "HIGH" %}
            <span class="text-xs px-2 py-0.5 rounded bg-orange-600">high</span>
            {% endif %}
        </div>
        <p class="mt-1 text-sm text-gray-300">{{ task.description[:100] }}{% if task.description|length > 100 %}...{% endif %}</p>
    </div>
    <button
        hx-post="/tasks/{{ task.id }}/cancel"
        hx-target="closest div.bg-gray-700"
        hx-swap="outerHTML"
        class="text-gray-500 hover:text-red-400 ml-2"
    >✕</button>
</div>
{% else %}
<p class="text-gray-500 text-center py-4">No pending tasks</p>
{% endfor %}
