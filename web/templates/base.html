<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ptero Studio{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [x-cloak] { display: none !important; }
        .htmx-indicator { opacity: 0; transition: opacity 200ms; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center space-x-8">
                    <a href="/" class="text-xl font-bold text-purple-400">🦖 Ptero Studio</a>
                    <a href="/" class="text-gray-300 hover:text-white">Dashboard</a>
                    <a href="/tasks" class="text-gray-300 hover:text-white">Tasks</a>
                    <a href="/projects" class="text-gray-300 hover:text-white">Projects</a>
                </div>
                <div id="daemon-status" hx-get="/partials/stats" hx-trigger="every 5s" hx-swap="innerHTML">
                    {% block daemon_status %}{% endblock %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast notifications -->
    <div id="toast" class="fixed bottom-4 right-4 z-50"></div>
</body>
</html>
