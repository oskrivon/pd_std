[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (may use Claude)
    e2e: End-to-end tests (slow, full cycle)
    slow: Slow tests

# Default options
addopts = -v --tb=short

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
